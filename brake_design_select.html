<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ブレーキ設計</title>
  <style>
     body { font-family: 'SansSerif', sans-serif; margin: 0; }
    .menubar { display: flex; background: #eee; padding: 8px; }
    .menu { margin-right: 20px; }
    .panel {margin: 40px auto; width: 360px; display: flex; flex-direction: column; align-items: stretch;}
    .label { font-size: 24px; font-weight: bold; margin-bottom: 20px; text-align: center;}
    .input-row { margin-bottom: 15px; display: flex;  align-items: center}
    .input-row label { width: 180px; }
    .input-row input { width: 150px; font-size: 16px; }
    .btn { font-size: 18px; padding: 6px 24px; width: 100%; box-sizing: border-box; }
    .btn{ height: 50px; }
      .back-button { width: auto; height: auto; font-size: 20px; padding: 4px 15px; align-self: flex-end; margin-top: 10px; }
    .btn + .btn { margin-top: 5px; }
    .font { font-family: 'Times New Roman', serif; }
    .description{font-size:20px;color:#555;margin-bottom:20px;white-space: nowrap;width:600px;margin-left:-120px;text-align: center;}
  </style>
</head>

    
<div class="panel">
    <div class="label">ブレーキ設計項目一覧</div>
    <div class="description">設計する項目を上から順番に選択してください。</div>
    <button id="btn1" class="btn" onclick="onDecide1()">(1)基本設計</button>
    <button id="btn2" class="btn" onclick="onDecide2()" disabled>(2)ブレーキレバー設計</button>
    <button id="btn3" class="btn" onclick="onDecide3()" disabled>(3)リベット設計</button>
    <button id="btn4" class="btn" onclick="onDecide4()" disabled>(4)調節金具設計</button>
    <button id="btn5" class="btn" onclick="onDecide5()" disabled>(5)ブラケット荷重</button>
    <button id="btn6" class="btn" onclick="onDecide6()" disabled>(6)取付ボルト設計</button>
    <button id="btn7" class="btn" onclick="onDecide7()" disabled>(7)ブレーキ帯取付ピン設計</button>
    <button id="btn8" class="btn" onclick="onDecide8()" disabled>(8)ブラケット設計</button>
    <button class="btn back-button" onclick="onBack()">戻る</button>
  </div>
  </div>
  <script>
    
    function onDecide1() {
      window.location.href = 'brake_design.html';

    }
    function onFileOpen() {
    }
    function onMenuSelect() {
    }
    window.onload = function() {
        if(localStorage.getItem("brake1") == "done"){
            document.getElementById("btn2").disabled = false;
        }

        if(localStorage.getItem("brake2") == "done"){
            document.getElementById("btn3").disabled = false;
        }

        if(localStorage.getItem("brake3") == "done"){
            document.getElementById("btn4").disabled = false;
        }

        if(localStorage.getItem("brake4") == "done"){
            document.getElementById("btn5").disabled = false;
        }

        if(localStorage.getItem("brake5") == "done"){
            document.getElementById("btn6").disabled = false;
        }

            document.getElementById("btn8").disabled = false;
        }
    }
    function onBack() {
      window.location.href = 'Choice.html';
    }
