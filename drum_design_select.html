<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ドラム設計</title>
  <style>
    body { font-family: 'SansSerif', sans-serif; margin: 0; }
    .menubar { display: flex; background: #eee; padding: 8px; }
    .menu { margin-right: 20px; }
    .panel {margin: 40px auto; width: 360px; display: flex; flex-direction: column; align-items: stretch;}
    .label { font-size: 24px; font-weight: bold; margin-bottom: 20px; text-align: center;}
    .input-row { margin-bottom: 15px; display: flex;  align-items: center}
    .input-row label { width: 180px; }
    .input-row input { width: 150px; font-size: 16px; }
    .btn { font-size: 18px; padding: 6px 24px; width: 100%; box-sizing: border-box; }
    .btn{ height: 50px; }
      .back-button { width: auto; height: auto; font-size: 20px; padding: 4px 15px; align-self: flex-end; margin-top: 10px; }
    .btn + .btn { margin-top: 5px; }
    .font { font-family: 'Times New Roman', serif; }
    .description{font-size:20px;color:#555;margin-bottom:20px;white-space: nowrap;width:600px;margin-left:-120px;text-align: center;}
  </style>
</head>

    
<div class="panel">
    <div class="label">ドラム設計項目一覧</div>
    <div class="description">設計する項目を上から順番に選択してください。</div>
    <button id="btn1" class="btn" onclick="onDecide1()">(1)ドラム基本設計</button>
    <button id="btn2" class="btn" onclick="onDecide2()" disabled>(2)ワイヤロープ長さ・巻き上げ荷重</button>
    <button id="btn3" class="btn" onclick="onDecide3()" disabled>(3)ドラムのフランジ設計</button>
    <button id="btn4" class="btn" onclick="onDecide4()" disabled>(4)ワイヤロープ止金具設計</button>
    <button id="btn5" class="btn" onclick="onDecide5()" disabled>(5)ドラム取付ボルト設計</button>
    <button class="btn back-button" onclick="onBack()">戻る</button>
  </div>
  <script>

    function onFileOpen() {
      alert('ファイルメニューが押されました');
    }
    function onMenuSelect() {
      alert('メニューが押されました');
    }
    function onDecide1() {
    window.location.href = 'drum_design1.html';
    }
    function onDecide2() {
    window.location.href = "drum_design2.html";
    }
    function onDecide3() {
    window.location.href = "drum_design3.html";
    }
    function onDecide4() {
    window.location.href = "drum_design4.html";
    }
    function onDecide5() {
    window.location.href = "drum_design5.html";
    }
    function onFileOpen() {
    }
    function onMenuSelect() {
    }

    window.onload = function(){

    if(localStorage.getItem("drum1") == "done"){
        document.getElementById("btn2").disabled = false;
    }

   if(localStorage.getItem("drum2") == "done"){
        document.getElementById("btn3").disabled = false;
    }

    if(localStorage.getItem("drum3") == "done"){
        document.getElementById("btn4").disabled = false;
    }

    if(localStorage.getItem("drum4") == "done"){
        document.getElementById("btn5").disabled = false;
    }
}
function onBack() {
      window.location.href = 'choice.html';
    }
  </script>
