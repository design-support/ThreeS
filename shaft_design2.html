 </style>

  <div class="panel">
    <div class="label">「設計した値を入れてください」</div>
    <div class="label">ドラム軸の材質はFC250を使用</div>

      <label for="VG">D歯車とブレーキを合わせた体積<span class="font">VG</span>[cm^3]</label>

      <button type="button" class="btn" style="margin-left:8px;" onclick="showHint('VG')">ヒント</button>
    </div>
    <div class="input-row">
      <label for="VD">ドラムとつめ車を合わせた体積<span class="font">VD</span>[cm^3]</label>
      <input id="VD" type="number" />
      <button type="button" class="btn" style="margin-left:8px;" onclick="showHint('VD')">ヒント</button>
    </div>
    <div class="input-row">
      <label for="WG">D歯車とブレーキを合わせた自重<span class="font">WG</span>[N]</label>
      <input id="WG" type="number" />
      <button type="button" class="btn" style="margin-left:8px;" onclick="showHint('WG')">ヒント</button>
    </div>
    <div class="input-row">
      <label for="WD">ドラムとつめ車を合わせた自重<span class="font">WD</span>[N]</label>
      <input id="WD" type="number" />
      <button type="button" class="btn" style="margin-left:8px;" onclick="showHint('WD')">ヒント</button>
    </div>
     <div class="input-row">
      <label for="FN">D歯車の歯面に直角に作用する力<span class="font">FN</span>[N]</label>
      <input id="FN" type="number" />
      <button type="button" class="btn" style="margin-left:8px;" onclick="showHint('FN')">ヒント</button>
    </div>
     <div class="input-row">
      <label for="WT">軸にかかる力の合力<span class="font">WT</span>[N]</label>

      <button type="button" class="btn" style="margin-left:8px;" onclick="showHint('WT')">ヒント</button>
    </div>
    <div class="input-row">

      <button type="button" class="btn" style="margin-left:8px;" onclick="showHint('a')">ヒント</button>
    </div>
    <div class="input-row">

      <input id="b" type="number" />
      <button type="button" class="btn" style="margin-left:8px;" onclick="showHint('b')">ヒント</button>
    </div>
    <div class="input-row">
      <label for="ds3">ドラム軸径<span class="font">ds3</span>[mm]</label>
      <select id="ds3">

        <option value="65">65</option>
        <option value="70">70</option>
        <option value="75">75</option>
      </select>
      <button type="button" class="btn" style="margin-left:8px;" onclick="showHint('ds3')">ヒント</button>
    </div>
    
    <button class="btn" onclick="onDecide()">保存</button>
    <button class="btn" onclick="onBack()">戻る</button>
  </div>

    const lostr = localStorage.getItem('drum_l0');

        }

        const WGanswer=VG*7.8e-3*9.81*1.2;

        if (WG > (VG+100)*7.8e-3*9.81*1.2) {

        const total_Wstr = localStorage.getItem('total_W');

          return;
        }

        const FT=(1000*W*(Dd/2))/((dD/2)*0.95);

        const FNanswer=FT/Math.cos(20*Math.PI/180);

        const FR=FT*Math.tan(20*Math.PI/180);

         if (FN > FNanswer+10) {
        alert('ドラム歯車の歯面に直角に作用する力が大きいです。計算をやり直してください');
        return;
        }

        const T=Math.sqrt(((T1*1000)**2)+((T2*1000)**2)-(2000000*T1*T2*Math.cos(120 * Math.PI / 180)));

        const θ1_deg = θ1_rad * 180 / Math.PI;

        }

         const o1o2=(da+db)/2;

         const o2o3=(da+dD)/2;

         const o1o3=(da+dD)/2;

         const B3_rad = Math.acos(((o1o3**2)-(o1o2**2)+(o2o3**2))/(2*o1o3*o2o3));
         const B3 = B3_rad * 180 / Math.PI;

         const B2=B3/2;

         const B1=B2+20;

         const WT1answer=Math.sqrt(((FN+W*1000)**2)+((WG+WD/2)**2)-(2*(FN+W*1000)*(WG+WD/2)*Math.cos((90+B1)*Math.PI/180)));

         

        const θ3=7.25+θ1_deg;

        const WT2answer=Math.sqrt((T+W*1000)**2+(WG+WD/2)**2-2*(T+W*1000)*(WG+WD/2)*Math.cos((90+θ3)*Math.PI/180));

        let WTanswer;
        if (WT2answer >= WT1answer) {
        WTanswer=WT2answer;
        } else {
        WTanswer=WT1answer;
        }

        if (WT > WTanswer + 100) {
        alert('軸にかかる力の合力が大きいです。計算をやり直してください');
        return;
        }

        if (WT < WTanswer-10) {
        alert('軸にかかる力の合力が小さいです。' + WTanswer + '計算' + B3 + 'をやり直し' + θ1_deg + 'てください' + θ3 + '');
        return;
        }



         if (a > 100+B+gearb/2) {
        alert('ドラム軸のスパンのAB間の長さが大きいです。計算をやり直してください');

        }
        
         if (a < B+gearb/2) {

        if (b > l0+2*tf+totalb+gearb/2+20) {
        alert('ドラム軸のスパンのBC間の長さが大きいです。計算をやり直してください');

         if (b < l0+tf+totalb+gearb/2) {
        alert('ドラム軸のスパンのBC間の長さが小さいです。計算をやり直してください');
        return;
        }

        const R1=(WTanswer*b)/(a+b);

        const MA=R1*a;

        const ds3answer0=(32*MA/Math.PI*194)**(1/3);

        let ds3answer = null;
if (ds3answer0 <50 && ds3answer0 >= 48) {
  ds3answer = 50;
} else if (ds3answer0 < 55 && ds3answer0 >= 50) 
  ds3answer = 55;
 else if (ds3answer0 < 65 && ds3answer0 >= 55) 
  ds3answer = 65;
 else if (ds3answer0 < 70 && ds3answer0 >= 65) 
  ds3answer = 70;
  else if (ds3answer0 < 75 && ds3answer0 >= 70) 
  ds3answer = 75;

        if (ds3 > ds3answer) {
        alert('ドラム軸の直径が大きいです。計算をやり直してください');
        return;
        }

         if (ds3 < ds3answer) {
        alert('ドラム軸の直径が小さいです。計算をやり直してください');
        return;
        }

      window.location.href = 'brake_design2.html';

      } else if(type === 'FN') {

      } else if(type === 'WG') {
        alert('材質はFC250で、密度は7.8*10^-3[g/mm^3]としています。体積は概算であるので安全のため1.2を掛けます。重力加速度は9.81[m/s^2]としています。');
      } else if(type === 'WD') {
        alert('材質はFC250で、密度は7.8*10^-3[g/mm^3]としています。体積は概算であるので安全のため1.2を掛けます。重力加速度は9.81[m/s^2]としています。');
      } else if(type === 'WT') {
        alert('教科書P.93 図8.6 P.94、95を参照してください。θは120°としています。ブレーキ張り側の張力は'+T1+'[kN]、ブレーキゆるみ側の張力は'+T2+'[kN]、A歯車の歯先円直径は'+dKA+'[mm]、B歯車の歯根円直径は'+dKB+'[mm]、D歯車の歯先円直径は'+dKD+'[mm]としています。歯車に作用する力を考慮した時とブレーキ時張力を考慮した時で二通りでるので、大きいほうを採用します。' ) ;
      } else if(type === 'a') {
        alert('教科書 P.97 図8.11、P.99 図8.14 を参照してください。ブレーキ輪の幅+D歯車の歯幅の半分+余白50mm前後でaの値を仮定してください。ブレーキ輪の幅は'+B+'[mm]、D歯車の歯幅は'+gearb+'[mm]、D歯車の歯幅は'+gearb+'[mm]としています。');

      } else if(type === 'ds3') {
