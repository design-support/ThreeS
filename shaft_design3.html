<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>軸設計</title>
  <style>
    body { font-family: 'SansSerif', sans-serif; margin: 0; }
    .menubar { display: flex; background: #eee; padding: 8px; }
    .menu { margin-right: 20px; }
    .panel { margin: 30px auto; width: 460px; }
    .label { font-size: 20px; font-weight: bold; margin-bottom: 0px; }
    .input-row { margin-bottom: 15px; display: flex; align-items: center; }
    .input-row label { width: 180px; }
    .input-row input { width: 150px; font-size: 16px; }
  .btn { font-size: 18px; padding: 4px 24px; white-space: nowrap; }
  .font { font-family: 'Times New Roman', serif; }
  </style>
</head>

  <div class="panel">
    <div class="label">設計した値を入れてください</div>
     <div class="label">「クランクアームの材質はSC360orSC410を使用」</div>
    <div class="input-row">
      <label for="material">クランクアームの材料<span class="font"></span></label>
      <select id="material">
        <option value="">-- 選択してください --</option>
        <option value="SC360">SC360</option>
        <option value="SC410">SC410</option>
      </select>
      <button type="button" class="btn" style="margin-left:8px;" onclick="showHint('material')">ヒント</button>
    </div>
    <div class="input-row">
      <label for="b1">アーム幅<span class="font">b1</span>[mm]</label>
      <input id="b1" type="number" />
      <button type="button" class="btn" style="margin-left:8px;" onclick="showHint('b1')">ヒント</button>
    </div>
    <div class="input-row">
      <label for="b2">厚み<span class="font">b2</span>[mm]</label>
      <input id="b2" type="number" />
      <button type="button" class="btn" style="margin-left:8px;" onclick="showHint('b2')">ヒント</button>
    </div>
    <button class="btn" onclick="onDecide()">保存</button>
    <button class="btn" onclick="onBack()">戻る</button>
  </div>
  <script>
  
    function onDecide() {
      const df = document.getElementById('material').value;
      const b1Val = document.getElementById('b1').value;
      const b2Val = document.getElementById('b2').value;
      if (b1Val === null || b1Val.toString().trim() === '' || b2Val === null || b2Val.toString().trim() === '') {
        alert('すべての項目を入力してください');
        return;
      }

      const b1 = parseFloat(b1Val);
      const b2 = parseFloat(b2Val);
      if (isNaN(b1) || isNaN(b2) ) {
        alert('有効な数値を入力してください');
        return;
      }

      if (b1 < 30 || b1 > 50) {
        alert('アーム幅は30mm~50mmの範囲で入力してください。');
        return;
      }

      if (b2 < 10 ) {
        alert('厚みは10mm以上で入力してください。');
        return;
      }

      const Lhstr = localStorage.getItem('handle_Lh');
      const Lh = Lhstr !== null ? parseFloat(Lhstr) : NaN;
      if (isNaN(Lh)) {
        alert('ハンドルの長さが設定されていません。');
        return;
      }

      const M = 147 * Lh;
      const Z = b2 * Math.pow(b1,2) / 6;
      const sigma = M / Z;

      alert(
        "曲げ応力σbを自動計算しました。\n" +
        "σb = " + sigma.toFixed(2) + " N/mm²"
      );
      

      let allowableStress;

    if (df === 'SC360') {
      allowableStress = 100;
    } else if (df === 'SC410') {
      allowableStress = 117;
    }

    if (sigma > allowableStress) {
      alert("曲げ応力が許容値" + allowableStress + " N/mm²を超えています。設計をやり直してください。");
      return;
    }

      localStorage.setItem('shaft_b1', b1);
      localStorage.setItem('shaft_b2', b2);
      localStorage.setItem('shaft_σb', sigma);
      alert('値が保存されました。');
      window.location.href = 'Choice.html';
    }

    function onBack() {
      window.location.href = 'Choice.html';
    }

    function showHint(type) {
      if (type === 'material') {
        const msg = 'クランクアームの材質はSC360またはSC410を選択してください。SC360の場合、許容繰り返し曲げ応力は100 N/mm²、SC410の場合は117 N/mm²です。';
        alert(msg);
      } else if (type === 'b1') {
        const msg = '教科書 P.100 式（8.19）を参照してください。アーム幅b1は30～50mmの範囲で入力してください。';
        alert(msg);
      } else if (type === 'b2') {
        const msg = '教科書 P.100 式（8.19）を参照してください。厚みb2は10mm以上で入力してください。また、長さlを超えない長さにしてください。';
        alert(msg);
      } else {
        alert('ヒントがありません');
      }
    }
  </script>
</body>
</html>
