<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>軸設計</title>
  <style>
    body { font-family: 'SansSerif', sans-serif; margin: 0; }
    .menubar { display: flex; background: #eee; padding: 8px; }
    .menu { margin-right: 20px; }
    .panel { margin: 30px auto; width: 410px; }
    .label { font-size: 20px; font-weight: bold; margin-bottom: 0px; }
    .input-row { margin-bottom: 15px; display: flex; align-items: center; }
    .input-row label { width: 180px; }
    .input-row input { width: 150px; font-size: 16px; }
  .btn { font-size: 18px; padding: 4px 24px; white-space: nowrap; }
  .font { font-family: 'Times New Roman', serif; }
  </style>
</head>

  <div class="panel">
    <div class="label">設計した値を入れてください</div>
    <div class="label">「にぎり心棒の材質はS20Cを使用」</div>
    <div class="input-row">
      <label for="a">にぎりの長さ<span class="font">a</span>[mm]</label>
      <input id="a" type="number" />
      <button type="button" class="btn" style="margin-left:8px;" onclick="showHint('a')">ヒント</button>
    </div>
    <div class="input-row">
      <label for="d1">心棒の太さ<span class="font">d1</span>[mm]</label>
      <input id="d1" type="number" />
      <button type="button" class="btn" style="margin-left:8px;" onclick="showHint('d1')">ヒント</button>
    </div>
    <div class="input-row">
      <label for="pipe">パイプの呼び<span class="font"></span></label>
      <select id="pipe">
        <option value="">-- 選択してください --</option>
        <option value="SGP32A">SGP32A</option>
        <option value="SGP40A">SGP40A</option>
      </select>
      <button type="button" class="btn" style="margin-left:8px;" onclick="showHint('pipe')">ヒント</button>
    </div>
    <div class="input-row">
      <label for="d2">パイプの外径<span class="font">d2</span>[mm]</label>
      <select id="d2">
        <option value="">-- 選択してください --</option>
        <option value="42.7">42.7</option>
        <option value="48.6">48.6</option>
      </select>
      <button type="button" class="btn" style="margin-left:8px;" onclick="showHint('d2')">ヒント</button>
    </div>
    <div class="input-row">
      <label for="d3bolt">座金(1)側のボルト呼び径<span class="font"></span></label>
      <select id="d3bolt">
        <option value="">-- 選択してください --</option>
        <option value="10">10</option>
        <option value="12">12</option>
        <option value="16">16</option>
        <option value="20">20</option>
        <option value="24">24</option>
      </select>
      <button type="button" class="btn" style="margin-left:8px;" onclick="showHint('d3bolt')">ヒント</button>
    </div>
    <div class="input-row">
      <label for="d4bolt">座金(2)側のボルト呼び径<span class="font"></span></label>
      <select id="d4bolt">
        <option value="">-- 選択してください --</option>
        <option value="10">10</option>
        <option value="12">12</option>
        <option value="16">16</option>
        <option value="20">20</option>
        <option value="24">24</option>
      </select>
      <button type="button" class="btn" style="margin-left:8px;" onclick="showHint('d4bolt')">ヒント</button>
    </div>
    <button class="btn" onclick="onDecide()">保存</button>
    <button class="btn" onclick="onBack()">戻る</button>
  </div>
  <script>

    function onDecide() {
      const aVal = document.getElementById('a').value;
      const d1Val = document.getElementById('d1').value;
      const pipeVal = document.getElementById('pipe').value;
      const d2Val = document.getElementById('d2').value;
      const d3boltVal = document.getElementById('d3bolt').value;
      const d4boltVal = document.getElementById('d4bolt').value;

      const a = Number(aVal);
      const d1 = Number(d1Val);
      const d2 = Number(d2Val);

      
      if (aVal === null || aVal.toString().trim() === '' || d1Val === null || d1Val.toString().trim() === '' || pipeVal === null || pipeVal.toString().trim() === '' || d2Val === null || d2Val.toString().trim() === '' || d3boltVal === null || d3boltVal.toString().trim() === '' || d4boltVal === null || d4boltVal.toString().trim() === '') {
        alert('すべての項目を入力してください');
        return;
      }

      if (a < 300 || a > 350) {
        alert('にぎりの長さは300mm~350mmの範囲で入力してください。');
        return;
      }

      if (d1 < 15 || d1 > 30) {
        alert('心棒の太さは15mm~30mmの範囲で入力してください。');
        return;
      }
      
      if (pipeVal === 'SGP32A' && d2Val !== '42.7') {
        alert('SGP32Aの場合、パイプの外径d2は42.7mmを選択してください。');
        return;
      }

      if (pipeVal === 'SGP40A' && d2Val !== '48.6') {
        alert('SGP40Aの場合、パイプの外径d2は48.6mmを選択してください。');
        return;
      }

      if (d5 >= d1 || d7 >= d1) {
        alert('ボルトの穴径は心棒の太さd1より小さい値を選択してください。');
      return;
      }

      if (d6 <= d2) {
        alert('座金(1)の外径がパイプの外径d2以下です。別のボルト呼び径を選択してください。');
      return;
      }

      if (d8 <= d2) {
        alert('座金(2)の外径がパイプの外径d2以下です。別のボルト呼び径を選択してください。');
      return;
     }

      let d5 = null;
      if  (d3boltVal == '10') {
       d5 = 10.50;
      } else if (d3boltVal == '12') 
       d5 = 13.00;
       else if (d3boltVal == '16') 
       d5 = 17.00;
      else if (d3boltVal == '20') 
       d5 = 21.00;
      else if (d3boltVal == '24') 
       d5 = 25.00;
      

      let d6 = null;
      if  (d3boltVal == '10') {
       d6 = 20.00;
      } else if (d3boltVal == '12') 
       d6 = 24.00;
       else if (d3boltVal == '16') 
       d6 = 30.00;
      else if (d3boltVal == '20') 
       d6 = 37.00;
      else if (d3boltVal == '24') 
       d6 = 44.00;
      

      let d7 = null;
      if  (d4boltVal == '10') {
       d7 = 10.50;
      } else if (d4boltVal == '12') 
       d7 = 13.00;
       else if (d4boltVal == '16') 
       d7 = 17.00;
      else if (d4boltVal == '20') 
       d7 = 21.00;
      else if (d4boltVal == '24') 
       d7 = 25.00;
      

      let d8 = null;
      if  (d4boltVal == '10') {
       d8 = 30.00;
      } else if (d4boltVal == '12') 
       d8 = 37.00;
       else if (d4boltVal == '16') 
       d8 = 50.00;
      else if (d4boltVal == '20') 
       d8 = 60.00;
      else if (d4boltVal == '24') 
       d8 = 72.00;
      
      
      localStorage.setItem('shaft_a', a);
      localStorage.setItem('shaft_d1', d1);
      localStorage.setItem('shaft_pipe', pipeVal);
      localStorage.setItem('shaft_d2', d2);
      localStorage.setItem('shaft_d3bolt', d3boltVal);
      localStorage.setItem('shaft_d4bolt', d4boltVal);
      localStorage.setItem('shaft_d5', d5);
      localStorage.setItem('shaft_d6', d6);
      localStorage.setItem('shaft_d7', d7);
      localStorage.setItem('shaft_d8', d8);
      alert('値が保存されました。座金の寸法は自動計算されました。記録ボタンを確認してください。');
      window.location.href = 'Choice.html';
    }

    function onBack() {
      window.location.href = 'Choice.html';
    }

    function showHint(type) {
      if   (type === 'a') {
        const msg = '教科書 P.100 式（8.18）を参照してください。aは二人巻き用の300～350mmの範囲で入力してください。';
        alert(msg);
      } else if (type === 'd1') {
        const msg = '教科書 P.101 式（8.20）を参照してください。d1は15～30mmの範囲で入力してください。';
        alert(msg);
      } else if (type === 'pipe') {
        const msg = '教科書 P.101 8.10表 を参照し、パイプの呼びを選択してください。外径d2が40～50mmの範囲のため、小さめに作りたい場合はSGP32A、大きめに作りたい場合はSGP40Aを選択してください。';
        alert(msg);
      } else if (type === 'd2') {
        const msg = '教科書 P.101 8.10表 を参照し、パイプ呼びに合う外径d2を選択してください。';
        alert(msg);
      } else if (type === 'd3bolt') {
        const msg = '教科書 P.163 付表5(a) を参照し、内径d1より小さいねじ呼び系dを選択してください。座金(1)では並形(部品等級A)を使用してください。';
        alert(msg);
      } else if (type === 'd4bolt') {
        const msg = '教科書 P.164 付表5(c) を参照し、内径d1より小さいねじ呼び系dを選択してください。座金(2)では大形(部品等級A)を使用してください。';
        alert(msg);
      } else {
        alert('ヒントがありません');
      }
    }
  </script>
</body>
</html>
